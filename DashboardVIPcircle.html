<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>HELPDESK Dashboard VIP Matrix Escalation</title>

<script src="https://unpkg.com/papaparse@5.4.1/papaparse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>
/* === TIDAK ADA PERUBAHAN STYLE === */
body{margin:0;font-family:Inter,Arial,sans-serif;background:#f4f6f9;color:#1f2937}
header{background:#fff;border-bottom:2px solid #e5e7eb;padding:16px 28px}
header h1{margin:0;font-size:26px;font-weight:700}
.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;padding:16px 28px;background:#fff;border-bottom:1px solid #e5e7eb;}
.summary-box{border-radius:10px;padding:16px}
.summary-box span{font-size:13px;font-weight:600}
.summary-box strong{font-size:28px;margin-top:6px;display:block}
.sum-fully{background:#fee2e2;color:#991b1b}
.sum-partial{background:#ffedd5;color:#9a3412}
.sum-linkdown{background:#fee2e2;color:#991b1b}
.sum-deg{background:#fef9c3;color:#854d0e}
.action-bar{display:flex;justify-content:flex-end;padding:10px 28px;background:#fff}
.action-bar button{padding:8px 14px;background:#2563eb;color:#fff;border:none;border-radius:6px;font-weight:600}
.container{padding:20px}
.section{margin-bottom:28px}
.section h2{margin:0 0 10px;padding:10px 14px;font-size:16px;font-weight:700;border-radius:6px}
.h15{background:#dcfce7;color:#166534}
.h30{background:#fef9c3;color:#854d0e}
.h1h{background:#ffedd5;color:#9a3412}
.h2h{background:#fee2e2;color:#991b1b}
.h4h{background:#7f1d1d;color:#fff}
table{width:100%;border-collapse:collapse;background:#fff}
th,td{border:1px solid #e5e7eb;padding:8px 10px;font-size:13px}
th{background:#f1f5f9}
.badge{padding:2px 8px;border-radius:12px;font-size:11px;font-weight:600}
.fully{background:#fee2e2;color:#991b1b}
.partial{background:#ffedd5;color:#9a3412}
.deg{background:#fef9c3;color:#854d0e}
.highlight{background:#dbeafe!important;animation:blink 1s ease-in-out 3}
@keyframes blink{0%{opacity:1}50%{opacity:.4}100%{opacity:1}}
.footer{text-align:right;font-size:12px;color:#64748b;padding:0 20px 10px}
td {max-width: 220px;word-break: break-word;vertical-align: top;}
</style>
</head>

<body>

<header><h1>Helpdesk Dashboard VIP SMTR KSMP JAVA Matrix Escalation</h1></header>

<div class="summary">
  <div class="summary-box sum-fully"><span>Fully Down</span><strong id="sumFully">0</strong></div>
  <div class="summary-box sum-partial"><span>Partial Down</span><strong id="sumPartial">0</strong></div>
  <div class="summary-box sum-deg"><span>Link Degradation</span><strong id="sumDeg">0</strong></div>
  <div class="summary-box sum-linkdown">
    <span>Link Down</span>
    <strong id="sumLinkDown">0</strong>
  </div>
</div>

<div class="action-bar">
  <button onclick="exportSnapshot()">Export Snapshot</button>
</div>

<div class="container" id="dashboard"></div>
<div class="footer" id="updateTime"></div>

<audio id="soundNew" src="https://actions.google.com/sounds/v1/alarms/beep_short.ogg"></audio>
<audio id="soundMove" src="https://actions.google.com/sounds/v1/alarms/beep_short.ogg"></audio>
<audio id="soundCritical" src="https://actions.google.com/sounds/v1/alarms/alarm_clock.ogg"></audio>

<script>
/* === CONFIG TIDAK BERUBAH === */
const CSV_URL="https://docs.google.com/spreadsheets/d/e/2PACX-1vS3d_FxYIsAl4yOLY6UtU6WMU9fiZfpBueMWXLW3jiG7vIfg-D3vfeuXCBgPhhbNh0voT_g_eq5Brb5/pub?gid=0&single=true&output=csv";
const REFRESH_INTERVAL=120000;
const SUPER_VIP_SITES=new Set([
    "14BYL0139","14BYL0137","14SMG0076","15WAT0001","15WAT0002","14SMG0214","14SMG0216","15YOG0035","16SDA0426","16SDA0436","16SBY0358","16SBY0081","16SBY0323","16SBY0319","17DPR0061",
    "17DPR0076","17DPR0097","17DPR0166","17DPR0298","17DPS0040","17DPS0058","18PYA0049","19KUP0101","19LBJ0005","16SBY0275","16SBY0270","16SBY0240","16SBY0278","16SBY0261","16SBY0235",
    "16SBY0292","16SBY0367","16SBY0306","16SBY0258","16SBY0400","16SDA0325","16SBY0669","16SDA0456","16SDA0389","16SDA0370","16SBY0645","16SBY0414","16SBY0260","16SBY0373","16SBY0370",
    "16SBY0314","16SBY0304","16SBY0264","16SDA0400","16SDA0398","16SDA0392","16SDA0361","16SDA0341","16SBY0380","16SBY0329","16SBY0297","16SBY0254","16SBY0253","16SDA0404","16SBY0648",
    "16SBY0394","16SBY0429","16SBY0418","16SBY0409","16SBY0393","16SBY0386","16SBY0366","16SBY0405","16SBY0259","16SBY0403","16SBY0384","16SBY0347","16SBY0357","16SBY0317","16SBY0307",
    "16SBY0339","16SDA0409","16SDA0339","16SDA0406","16SBY0413","16SDA0331","16SBY0406","16SDA0349","16SDA0319","16SDA0329","16SBY0381","20SRY0102","23BBR0003","20SRY0096","29MRS0035",
    "29MRS0027","25MDO0192","33JAY0003","29UPD0030","29UPD0031","25MDO0082","33JAP0007","29UPD0044","29UPD0024","29UPD0010","33MRK0035","29UPD0422","29UPD0451","29UPD0039","29UPD0378",
    "29UPD0446","29UPD0218","29UPD0326","29UPD0161","29UPD0372","29UPD0184","29UPD0107","29UPD0404","29UPD0364","29UPD0029","29UPD0437","29UPD0183","29UPD0170","29UPD0033","29UPD0259",
    "29UPD0290","29UPD0148","29UPD0041","29MRS0012","29UPD0391","29UPD0235","29UPD0058","29UPD0276","29UPD0118","29UPD0286","29MRS0020","29UPD0089","29UPD0040","29UPD0407","29UPD0348",
    "29UPD0034","29UPD0275","29UPD0086","29UPD0128","03PMT0055","03PMT0056","04PBR0229","04PBR0228","05BTM0290","02LBP0426","02LBP0481","02LBP0500","02LBP0423","02LBP0397","02LBP0409",
    "02MDN0399","02MDN0400","02MDN0300","02MDN0095","07PLG0044","07PLG0049","07PLG0188","07PLG0196","07PLG0200","10PKP0036","02MDN0550","02LBP0334","02LBP0300","02LBP0289","02MDN0412",
    "02MDN0365","02LBP0277","02MDN0346","02MDN0466","02MDN0523","02MDN0432","02MDN0458","02LBP0283","02MDN0487","02MDN0428","02MDN0413","02LBP0243","02LBP0335","02LBP0302","02MDN0510",
    "02MDN0366","02MDN0542","02MDN0566","02LBP0286","02MDN0491","02LBP0215","02MDN0504","02LBP0260","02LBP0353","02MDN0561","02LBP0375","02LBP0265","02LBP0346","02MDN0529","02LBP0288",
    "02LBP0325","02MDN0558","02MDN0332","02LBP0372","02LBP0307","02MDN0562","02MDN0537","02LBP0386","02LBP0317","02LBP0359"

]);
let previousBucket={};

function exportSnapshot(){
  const target = document.body;
  html2canvas(target,{scale:2,useCORS:true}).then(canvas=>{
    const link=document.createElement("a");
    link.download="Dashboard_Super_VIP_"+new Date().toISOString().slice(0,19).replace(/:/g,"-")+".png";
    link.href=canvas.toDataURL("image/png");
    link.click();
  });
}

function renderSection(bucket,rows){
const titleMap={15:"≥ 15 Minute (Lvl.1)",120:"≥ 2 Hours (Lvl.2)",240:"≥ 4 Hours (Lvl.3)",480:"≥ 8 Hours (Lvl.4)",720:"≥ 12 Hours (CRITICAL Lvl.5)"};
const classMap={15:"h15",120:"h30",240:"h1h",480:"h2h",720:"h4h"};
let html=`<div class="section"><h2 class="${classMap[bucket]}">${titleMap[bucket]} (${rows.length})</h2>
<table><thead><tr>
<th>Site ID</th>
<th>Site Name</th>
<th>Finding</th>
<th>Service Impact</th>
<th>Matrix</th>
<th>Escalate To</th>
<th>RCA Category</th>
<th>Open</th>
<th>Aging (H)</th>
<th>TT</th>
<th>WO</th>
</tr></thead><tbody>`;
rows.forEach(r=>{
html+=`<tr class="${r.highlight?'highlight':''}">
<td>${r.site_id}</td>
<td>${r.site_name}</td>
<td>${r.finding || '-'}</td>
<td><span class="badge ${r.findingClass}">${r.serviceImpact}</span></td>
<td>${r.matrix || '-'}</td>
<td>${r.escalateTo || '-'}</td>
<td>${r.rcaCategory || '-'}</td>
<td>${r.openDate || '-'}</td>
<td>${r.agingHours || '-'}</td>
<td>${r.tt || '-'}</td>
<td>${r.wo || '-'}</td>
</tr>`;
});
return html+"</tbody></table></div>";
}

async function loadData(){
const url = CSV_URL + "&_ts=" + Date.now();
const csv = await (await fetch(url,{cache:"no-store"})).text();
const data = Papa.parse(csv,{header:true}).data;

let buckets={15:[],120:[],240:[],480:[],720:[]},
    next={}, sf=0, sp=0, sld=0, sdeg=0;

data.forEach(r=>{
const siteId=r["Site ID"]?.trim();
const status=(r["Status NOC"]||"").toUpperCase();
if(!siteId||status==="CLOSED"||status==="MONITORING"||!SUPER_VIP_SITES.has(siteId))return;

const impactRaw=(r["Service Impact"]||"");
const impact=impactRaw.toString().replace(/\u00A0/g," ").replace(/\s+/g," ").trim();
const up=impact.toUpperCase();

let findingType=null;
if(up.includes("LINK DOWN")){findingType="Link Down";sld++;}
else if(up.includes("LINK DEGRADATION")){findingType="Link Degraded";sdeg++;}
else if(up.includes("PARTIAL")){findingType="Partial Down";sp++;}
else if(up.includes("FULL")||(up.includes("DOWN")&&!up.includes("PARTIAL"))){findingType="Fully Down";sf++;}
else{return;}

const agingH=parseFloat(r["Aging Hours"]);
if(isNaN(agingH))return;

const min = agingH * 60;

let bucket;
if (min >= 720) {
  bucket = 720;
}
else if (min >= 480) {
  bucket = 480;
}
else if (min >= 240) {
  bucket = 240;
}
else if (min >= 120) {
  bucket = 120;
}
else if (min >= 15) {
  bucket = 15;
}
else {
  return; // < 15 menit, tidak ditampilkan
}

if(previousBucket[siteId]==="720")bucket=720;
next[siteId]=bucket;

const isNew=previousBucket[siteId]===undefined;
const isMove=!isNew&&previousBucket[siteId]!==bucket;

if(isNew){soundNew.play().catch(()=>{});}
else if(isMove&&bucket===720){soundCritical.play().catch(()=>{});}
else if(isMove){soundMove.play().catch(()=>{});}

/* ===== MATRIX (MINIMAL & SAFE) ===== */
const matrixRaw = (r["Matrix"] || "").toString();
const matrixClean = matrixRaw
  .split(/[;,]/)
  .map(v=>v.trim())
  .filter(v=>v.length>0)
  .join(", ");

buckets[bucket].push({
  site_id:siteId,
  site_name:r["Site Name"],
  finding:r["Founding"],
  findingClass:
    findingType==="Fully Down"?"fully":
    findingType==="Partial Down"?"partial":
    findingType==="Link Down"?"fully":"deg",
  serviceImpact:impact,
  matrix:matrixClean,                 // ✅ MATRIX
  escalateTo:r["Escalate to"],
  rcaCategory:r["RCA Category"],
  openDate:r["Open Date"],
  agingHours:r["Aging Hours"],
  tt:r["TT"],
  wo:r["WO"],
  highlight:isNew||isMove
});
});

previousBucket=next;
sumFully.innerText=sf;
sumPartial.innerText=sp;
sumLinkDown.innerText=sld;
sumDeg.innerText=sdeg;

dashboard.innerHTML =
  renderSection(15,buckets[15]) +
  renderSection(120,buckets[120]) +
  renderSection(240,buckets[240]) +
  renderSection(480,buckets[480]) +
  renderSection(720,buckets[720]);

updateTime.innerText="Last Update: "+new Date().toLocaleString();
}

loadData();
setInterval(loadData,REFRESH_INTERVAL);
</script>
</body>
</html>
