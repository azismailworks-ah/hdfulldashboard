renderSite=function(){renderSiteExportBase();currentSiteRows=(payload.sites||[]).filter(filterNode).filter(site=>siteIssueCategory(site));const excel=document.querySelector('#exportExcel'),text=document.querySelector('#exportText');excel.hidden=false;text.hidden=false;excel.textContent='EXPORT SITE EXCEL';text.textContent='EXPORT SITE TEXT WAG'};
const renderTransportExportBase=renderTransport;
renderTransport=function(){renderTransportExportBase();currentSiteRows=[];document.querySelector('#exportExcel').textContent='EXPORT EXCEL';document.querySelector('#exportText').textContent='EXPORT TEXT WAG'};
function siteAlarmDetails(site){const seen=new Set(),details=[];for(const alarm of site.alarms||[]){const name=String(alarm.name||alarm.alarm_name||'-').trim(),when=alarmWhen(alarm.start_time||alarm.first_occurrence),scenario=String(alarm.scenario||'').replaceAll('_',' '),node=String(alarm.node||alarm.alarm_source||'-').trim(),key=[name.toUpperCase(),String(when).toUpperCase(),node.toUpperCase()].join('|');if(seen.has(key))continue;seen.add(key);details.push({name,when,scenario,node})}return details.sort((a,b)=>String(a.when).localeCompare(String(b.when))||a.name.localeCompare(b.name))}
function exportSiteExcel(){const rows=visibleSiteRows(),header=['Issue Category','Circle','Site ID','Site Name','VIP Type','Status','Alarm Count','Alarm Details','Ticket - WO','TWAMP PLR (%)','TWAMP Delay (ms)','TWAMP Threshold (ms)','TWAMP Timestamp'],body=rows.map(site=>{const alarms=siteAlarmDetails(site),alarmText=alarms.map(a=>`${a.when} | ${a.name} | ${a.scenario} | ${a.node}`).join('\n');return[siteCategoryLabel(siteIssueCategory(site)),site.circle,site.site_id,site.site_name,site.vip_type,site.status,alarms.length,alarmText,ticketWO(site),site.kpi?.plr??'',site.kpi?.delay??'',site.kpi?.delay_threshold??'',site.kpi?.timestamp??'']});const csv='\ufeff'+[header,...body].map(row=>row.map(csvCell).join(',')).join('\r\n'),stamp=new Date().toISOString().slice(0,19).replaceAll(':','-');downloadBlob(csv,'text/csv;charset=utf-8',`VIP_Site_Active_Issue_${stamp}.csv`)}
function buildSiteText(rows){const order=['NE_DOWN','CELL_DOWN','SIA_IMPACT','TWAMP_ISSUE'],labels={NE_DOWN:'NE DOWN',CELL_DOWN:'CELL DOWN',SIA_IMPACT:'SIA IMPACT',TWAMP_ISSUE:'TWAMP ISSUE'},circles=new Map();for(const site of rows){const category=siteIssueCategory(site);if(!category)continue;const circleName=String(site.circle||'UNKNOWN CIRCLE').trim().toUpperCase();if(!circles.has(circleName))circles.set(circleName,new Map(order.map(key=>[key,[]])));circles.get(circleName).get(category).push(site)}const categoryTotals=Object.fromEntries(order.map(key=>[key,[...circles.values()].reduce((n,groups)=>n+groups.get(key).length,0)])),siteCount=order.reduce((n,key)=>n+categoryTotals[key],0),alarmCount=rows.reduce((n,site)=>n+siteAlarmDetails(site).length,0),generated=new Date().toLocaleString('id-ID',{timeZone:'Asia/Jakarta',dateStyle:'full',timeStyle:'medium'}),formatSource=value=>value?new Date(value).toLocaleString('id-ID',{timeZone:'Asia/Jakarta'}):'-',circleFilter=document.querySelector('#circle')?.value||'ALL',vipFilter=document.querySelector('#vip')?.value||'ALL',searchFilter=document.querySelector('#search')?.value.trim()||'-',parts=['*PROACTIVE MONITORING VIP SITE ISSUE*','*HELPDESK DIOC*','',`Report Time : ${generated} WIB`,`OWS Snapshot : ${formatSource(payload.source_updates?.alarms)} WIB`,`TWAMP Snapshot : ${formatSource(payload.source_updates?.twamp)} WIB`,`Scope : Circle ${circleFilter} | VIP ${vipFilter} | Search ${searchFilter}`,'Status : ACTIVE ISSUE','',`*NATIONAL SUMMARY*`,`Unique Site Issue : ${siteCount}`,`Active RAN Alarm : ${alarmCount}`,`NE Down : ${categoryTotals.NE_DOWN}`,`Cell Down : ${categoryTotals.CELL_DOWN}`,`SIA Impact : ${categoryTotals.SIA_IMPACT}`,`TWAMP Issue Only : ${categoryTotals.TWAMP_ISSUE}`,'','========================================',''];for(const circleName of [...circles.keys()].sort((a,b)=>a.localeCompare(b))){const groups=circles.get(circleName),circleTotal=order.reduce((n,key)=>n+groups.get(key).length,0);parts.push(`*CIRCLE ${circleName}*`,`Summary : ${circleTotal} Unique Site Issue`,`NE: ${groups.get('NE_DOWN').length} | Cell: ${groups.get('CELL_DOWN').length} | SIA: ${groups.get('SIA_IMPACT').length} | TWAMP Only: ${groups.get('TWAMP_ISSUE').length}`,'');for(const key of order){const sites=groups.get(key).sort((a,b)=>String(a.site_id).localeCompare(String(b.site_id)));if(!sites.length)continue;parts.push(`*${labels[key]} (${sites.length} SITE)*`);sites.forEach((site,index)=>{const alarms=siteAlarmDetails(site),ticket=ticketWO(site);parts.push(`${index+1}. Site ID : ${site.site_id}`,`   Site Name : ${site.site_name||'-'}`,`   VIP Type : ${site.vip_type||'-'}`,`   Ticket - WO : ${ticket}`);if(alarms.length){parts.push(`   Alarm Count : ${alarms.length}`,'   Alarm Detail :');alarms.forEach((alarm,n)=>parts.push(`   ${n+1}) ${alarm.when} | ${alarm.name}`,`      Scenario: ${alarm.scenario||'-'} | NE: ${alarm.node}`))}else parts.push('   Alarm Detail : Tidak ada alarm RAN aktif');if(site.kpi?.issue){parts.push(`   TWAMP Observation : PLR ${site.kpi.plr??'-'}% | Delay ${site.kpi.delay??'-'} ms | Threshold ${site.kpi.delay_threshold??'-'} ms`,`   TWAMP Data Time : ${alarmWhen(site.kpi.timestamp)}`)}parts.push('')});}parts.push('----------------------------------------','')}parts.push('*END OF REPORT*');return parts.join('\r\n').trim()+'\r\n'}
async function exportSiteTextNoc(){const rows=visibleSiteRows();if(!rows.length){alert('Tidak ada issue Site pada filter aktif.');return}const text=buildSiteText(rows),stamp=new Date().toISOString().slice(0,19).replaceAll(':','-');let copied=false;try{await navigator.clipboard.writeText(text);copied=true}catch(error){}downloadBlob('\ufeff'+text,'text/plain;charset=utf-8',`Report_Proactive_VIP_Site_Issue_${stamp}.txt`);const button=document.querySelector('#exportText'),label=button.textContent;button.textContent=copied?'COPIED + TXT':'TXT DOWNLOADED';setTimeout(()=>button.textContent=label,1800)}
document.querySelector('#exportExcel').onclick=()=>mode==='site'?exportSiteExcel():exportTransportExcel();
document.querySelector('#exportText').onclick=()=>mode==='site'?exportSiteTextNoc():exportTransportTextNoc();
document.head.insertAdjacentHTML('beforeend','<style id="transport-scorecard-layout">@media(max-width:900px){.cards{grid-template-columns:repeat(2,1fr)!important}}</style>');
function countTransportIssueSegments(rows,linkCategory){const segments=new Set();for(const alarm of rows){if(String(alarm.category||'').toUpperCase()!=='LINK_ISSUE'||String(alarm.link_category||'').toUpperCase()!==linkCategory)continue;const edgeIds=(alarm.edge_ids||[]).filter(Boolean);if(edgeIds.length)edgeIds.forEach(id=>segments.add(String(id).trim().toUpperCase()));else{const pair=[deviceName(alarm.me_name||alarm.source),deviceName(alarm.destination)].sort().join('<>');if(pair!=='<>')segments.add(pair)}}return segments.size}
const renderTransportScorecardBase=renderTransport;
renderTransport=function(){renderTransportScorecardBase();cards.style.gridTemplateColumns='repeat(8,minmax(0,1fr))';cards.insertAdjacentHTML('beforeend',card('VIP LINK ISSUE',countTransportIssueSegments(currentTransportRows,'VIP_SITE_LINK_ISSUE'),'#ff3f61')+card('SUPER VIP LINK ISSUE',countTransportIssueSegments(currentTransportRows,'SUPER_VIP_LINK_ISSUE'),'#ff3f61'))};

renderSite=function(){renderSiteScorecardBase();cards.style.gridTemplateColumns='repeat(6,minmax(0,1fr))'};
