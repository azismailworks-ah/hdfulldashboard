<script id="netdrone-motion-engine-v2-script">
(function(){
 const scroller=document.getElementById('table'),head=document.querySelector('.alarm-head');if(!scroller||!head)return;
 const status=document.createElement('span');status.className='motion-status';status.textContent='AUTO SCROLL';head.appendChild(status);
 let exactPosition=0,lastTime=0,pauseUntil=Date.now()+1600,bottomUntil=0,renderVersion=0;
 function pause(ms=6000){exactPosition=scroller.scrollTop;pauseUntil=Date.now()+ms;status.className='motion-status is-paused';status.textContent='MANUAL CONTROL'}

 function tick(time){requestAnimationFrame(tick);const overflow=scroller.scrollHeight-scroller.clientHeight;if(document.hidden||matchMedia('(prefers-reduced-motion: reduce)').matches||overflow<8){exactPosition=scroller.scrollTop;status.className='motion-status is-idle';status.textContent=overflow<8?'ALL VISIBLE':'MOTION OFF';lastTime=time;return}if(Date.now()<pauseUntil){exactPosition=scroller.scrollTop;status.className='motion-status is-paused';status.textContent='MANUAL CONTROL';lastTime=time;return}status.className='motion-status';status.textContent=mode==='site'?'SITE ISSUE FLOW':'TRANSPORT ISSUE FLOW';if(!lastTime)lastTime=time;const elapsed=Math.min(50,time-lastTime);lastTime=time;if(scroller.scrollTop>=overflow-2){if(!bottomUntil)bottomUntil=Date.now()+1500;if(Date.now()>=bottomUntil){exactPosition=0;scroller.scrollTo({top:0,behavior:'smooth'});bottomUntil=0;pauseUntil=Date.now()+850}return}bottomUntil=0;exactPosition=Math.max(exactPosition,scroller.scrollTop)+elapsed*.030;scroller.scrollTop=Math.min(overflow,Math.floor(exactPosition))}
 ['wheel','touchstart','pointerdown','keydown'].forEach(type=>scroller.addEventListener(type,()=>pause(type==='pointerdown'?3500:7000),{passive:true}));
 function beaconClass(node){const value=String(node.status||'').trim().toUpperCase();if(value==='CRITICAL')return'is-critical';if(value==='SIA')return'is-sia';if(value==='KPI')return'is-kpi';if(value==='DOWN')return'is-transport';return''}
 function installBeacons(){const alerts=[];layers.eachLayer(layer=>{if(layer.__ndBeacon)return;const node=layer.__node,kind=node&&beaconClass(node);if(kind&&node.lat!=null&&node.lon!=null)alerts.push({lat:node.lat,lon:node.lon,kind});const path=layer._path;if(path&&String(layer.options?.color||'').toUpperCase()==='#FF3F61'&&!node)path.classList.add('nd-moving-alert')});for(const item of alerts){const icon=L.divIcon({className:'nd-beacon-host',html:`<span class="nd-beacon ${item.kind}"><i></i></span>`,iconSize:[54,54],iconAnchor:[27,27]});const halo=L.marker([item.lat,item.lon],{icon,interactive:false,keyboard:false,zIndexOffset:900,pane:'markerPane'});halo.__ndBeacon=true;halo.addTo(layers)}}
 const siteV2=renderSite,transportV2=renderTransport;
 renderSite=function(){const result=siteV2();resetMotion();requestAnimationFrame(installBeacons);return result};
 renderTransport=function(){const result=transportV2();resetMotion();requestAnimationFrame(installBeacons);return result};
 // Motion Engine v3 owns scrolling. Older RAF motor intentionally disabled.
})();
</script>

<script id="netdrone-scroll-engine-v3">
(function(){
 const scroller=document.getElementById('table'),panel=document.querySelector('#operationsWorkspace>.alarm-wrap');if(!scroller||!panel)return;
 const status=panel.querySelector('.motion-status');let hovering=false,manualUntil=Date.now()+1200,bottomSince=0,resetting=false;
 scroller.style.scrollBehavior='auto';
 function show(state,text){if(!status)return;status.className=`motion-status ${state}`;status.textContent=text}
 function pauseManual(ms=5000){manualUntil=Date.now()+ms;show('v3-paused','MANUAL CONTROL')}
 panel.addEventListener('pointerenter',()=>{hovering=true;panel.classList.add('operator-hover');show('v3-paused','HOVER · PAUSED')});
 panel.addEventListener('pointerleave',()=>{hovering=false;panel.classList.remove('operator-hover');manualUntil=Date.now()+450;show('v3-paused','RESUME SOON')});
 scroller.addEventListener('wheel',()=>pauseManual(6500),{passive:true});scroller.addEventListener('touchstart',()=>pauseManual(8000),{passive:true});scroller.addEventListener('focusin',()=>pauseManual(8000));
 function step(){const max=Math.max(0,scroller.scrollHeight-scroller.clientHeight);if(document.hidden||matchMedia('(prefers-reduced-motion: reduce)').matches){show('is-idle','MOTION OFF');return}if(max<6){show('is-idle','ALL VISIBLE');bottomSince=0;return}if(hovering){show('v3-paused','HOVER · PAUSED');return}if(Date.now()<manualUntil){show('v3-paused','MANUAL CONTROL');return}if(resetting)return;if(scroller.scrollTop>=max-1){if(!bottomSince)bottomSince=Date.now();show('v3-reset','END · RESTARTING');if(Date.now()-bottomSince>=1600){resetting=true;scroller.scrollTo({top:0,behavior:'smooth'});setTimeout(()=>{resetting=false;bottomSince=0;manualUntil=Date.now()+500},700)}return}bottomSince=0;show('v3-running',mode==='site'?'SITE ISSUE FLOW':'TRANSPORT ISSUE FLOW');scroller.scrollTop=Math.min(max,scroller.scrollTop+1)}
 setInterval(step,28);
})();
</script>
<style id="netdrone-locate-focus-v4-style">
.nd-locate-host{overflow:visible!important;background:transparent!important;border:0!important;pointer-events:none!important}.nd-locate-pointer{--focus:#28e5ff;position:relative;width:220px;height:126px;transform:translate(-50%,-100%);filter:drop-shadow(0 12px 24px #000b)}.nd-locate-card{position:absolute;left:50%;bottom:36px;width:220px;transform:translateX(-50%);padding:10px 12px 12px;border:1px solid var(--focus);border-radius:10px;background:linear-gradient(145deg,#06182af7,#071226f2);box-shadow:0 0 0 1px #fff1 inset,0 0 22px color-mix(in srgb,var(--focus) 48%,transparent);color:#effaff;text-align:center;white-space:normal;overflow:hidden}.nd-locate-card::after{content:"";position:absolute;left:0;bottom:0;width:100%;height:3px;background:var(--focus);transform-origin:left center;animation:locate-countdown 8s linear forwards}.nd-locate-kicker{display:block;margin-bottom:4px;color:var(--focus);font-size:8px;font-weight:900;letter-spacing:1.3px}.nd-locate-card b{display:block;font:800 11px Bahnschrift,"Segoe UI",sans-serif;letter-spacing:.3px}.nd-locate-card small{display:block;margin-top:3px;color:#91bdd4;font-size:8px;line-height:1.3}.nd-locate-arrow{position:absolute;left:50%;bottom:22px;width:0;height:0;transform:translateX(-50%);border-left:10px solid transparent;border-right:10px solid transparent;border-top:15px solid var(--focus);filter:drop-shadow(0 0 7px var(--focus));animation:locate-arrow-bob .7s ease-in-out infinite}.nd-locate-core{position:absolute;left:50%;bottom:5px;width:15px;height:15px;transform:translateX(-50%);border:3px solid #fff;border-radius:50%;background:var(--focus);box-shadow:0 0 7px #fff,0 0 16px var(--focus),0 0 30px var(--focus);animation:locate-core-pulse .68s ease-in-out infinite}.nd-locate-core::before,.nd-locate-core::after{content:"";position:absolute;left:50%;top:50%;width:18px;height:18px;border:2px solid var(--focus);border-radius:50%;transform:translate(-50%,-50%);animation:locate-radar 1.3s ease-out infinite}.nd-locate-core::after{animation-delay:.62s}.nd-locate-pointer.is-link{--focus:#ff4f87}.leaflet-interactive.nd-locate-link{stroke:#ff4f87!important;stroke-width:10!important;stroke-linecap:round;stroke-dasharray:14 11!important;filter:drop-shadow(0 0 5px #ff3f78) drop-shadow(0 0 13px #ff3f7899);animation:locate-link-run .52s linear infinite,locate-link-glow .8s ease-in-out infinite}.nd-locate-corner{position:absolute;z-index:920;top:12px;left:50%;transform:translateX(-50%);padding:7px 12px;border:1px solid #32e4ff;border-radius:999px;background:#061526e8;color:#dffaff;font-size:9px;font-weight:800;letter-spacing:.5px;box-shadow:0 0 20px #22dff044;backdrop-filter:blur(10px);pointer-events:none}
@keyframes locate-countdown{to{transform:scaleX(0)}}@keyframes locate-arrow-bob{50%{transform:translate(-50%,5px)}}@keyframes locate-core-pulse{50%{transform:translateX(-50%) scale(1.32);filter:brightness(1.5)}}@keyframes locate-radar{0%{transform:translate(-50%,-50%) scale(.65);opacity:1}100%{transform:translate(-50%,-50%) scale(3.1);opacity:0}}@keyframes locate-link-run{to{stroke-dashoffset:-25}}@keyframes locate-link-glow{50%{stroke-width:13;opacity:1}}@media(prefers-reduced-motion:reduce){.nd-locate-card::after,.nd-locate-arrow,.nd-locate-core,.nd-locate-core::before,.nd-locate-core::after,.leaflet-interactive.nd-locate-link{animation:none!important}}

<script id="netdrone-locate-focus-v4">
(function(){
 let focusMarker=null,focusLine=null,focusTimer=null,focusChip=null;
 const key=value=>String(value??'').trim().toUpperCase();
 function nodeById(value){const wanted=key(value);return(payload.nodes||[]).find(node=>key(node.id)===wanted)}
 function validNode(node){return node&&Number.isFinite(Number(node.lat))&&Number.isFinite(Number(node.lon))}
 function clearFocus(){if(focusTimer){clearTimeout(focusTimer);focusTimer=null}if(focusMarker){map.removeLayer(focusMarker);focusMarker=null}if(focusLine){map.removeLayer(focusLine);focusLine=null}if(focusChip){focusChip.remove();focusChip=null}}
 function addChip(text){const layout=document.querySelector('#operationsWorkspace>.layout');if(!layout)return;focusChip=document.createElement('div');focusChip.className='nd-locate-corner';focusChip.textContent=text;layout.appendChild(focusChip)}
 function addPointer(latlng,alarm,isLink){const label=alarm.site_id||'-',name=alarm.alarm_name||'Selected alarm',detail=isLink?`${alarm.me_name||deviceName(alarm.source)||'-'} → ${alarm.destination||'-'}`:(alarm.me_name||deviceName(alarm.source)||alarm.source||'-'),icon=L.divIcon({className:'nd-locate-host',html:`<div class="nd-locate-pointer ${isLink?'is-link':''}"><div class="nd-locate-card"><span class="nd-locate-kicker">${isLink?'SELECTED LINK ISSUE':'SELECTED NODE ISSUE'} · 8 SEC</span><b>${esc(label)} · ${esc(name)}</b><small>${esc(detail)}</small></div><span class="nd-locate-arrow"></span><span class="nd-locate-core"></span></div>`,iconSize:[220,126],iconAnchor:[110,126]});focusMarker=L.marker(latlng,{icon,interactive:false,keyboard:false,zIndexOffset:1200,pane:'popupPane'}).addTo(map)}
 function revealPopup(node){if(!node)return;layers.eachLayer(layer=>{if(layer.__node&&key(layer.__node.id)===key(node.id)&&typeof layer.openPopup==='function')layer.openPopup()})}
 window.focusCase=function(id){clearFocus();const alarm=(payload.alarms||[]).find(item=>String(item.id)===String(id));if(!alarm){alert('Alarm yang dipilih tidak ditemukan pada snapshot aktif.');return}const edge=(payload.edges||[]).find(item=>(alarm.edge_ids||[]).includes(item.id));if(edge){const a=nodeById(edge.source),b=nodeById(edge.destination);if(validNode(a)&&validNode(b)){const points=[[Number(a.lat),Number(a.lon)],[Number(b.lat),Number(b.lon)]],center=L.latLngBounds(points).getCenter();focusLine=L.polyline(points,{pane:'overlayPane',interactive:false,className:'nd-locate-link',color:'#ff4f87',weight:10,opacity:1}).addTo(map);addPointer(center,alarm,true);addChip(`LOCATING LINK · ${alarm.site_id||'-'}`);map.flyToBounds(L.latLngBounds(points),{paddingTopLeft:[90,130],paddingBottomRight:[90,130],maxZoom:16,duration:1.15});focusTimer=setTimeout(clearFocus,8000);return}}
  const candidates=[alarm.me_name,alarm.source,alarm.destination,...(alarm.node_ids||[])].map(deviceName).filter(Boolean);let node=candidates.map(nodeById).find(validNode);if(!node)node=(payload.nodes||[]).find(item=>key(item.site_id)===key(alarm.site_id)&&validNode(item));if(!node){alert('Koordinat node untuk alarm ini belum tersedia pada topology.');return}const latlng=[Number(node.lat),Number(node.lon)];addPointer(latlng,alarm,false);addChip(`LOCATING NODE · ${alarm.site_id||'-'}`);map.flyTo(latlng,16,{duration:1.15});map.once('moveend',()=>revealPopup(node));focusTimer=setTimeout(clearFocus,8000)};
 window.__clearNetdroneLocateFocus=clearFocus;
})();
</script></body></html>
