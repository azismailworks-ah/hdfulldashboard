<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>HELPDESK VIP & HOTSPOT REALTIME ALARM</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/papaparse@5.4.1/papaparse.min.js"></script>

<style>
body{
  margin:0;
  font-family:'Inter', sans-serif;
  background:#f4f6f9;
  color:#1f2937;
}

/* HEADER */
.header{
  background:linear-gradient(135deg,#0f172a,#1e293b);
  color:#fff;
  padding:24px 32px;
}
.header h1{
  margin:0;
  font-size:26px;
  font-weight:700;
}
.header .update{
  margin-top:6px;
  font-size:13px;
  opacity:.85;
}

/* CONTENT */
.container{ padding:20px 24px; }

.action-bar{
  display:flex;
  justify-content:flex-end;
  margin-bottom:10px;
}
.action-bar button{
  background:#0f172a;
  color:#fff;
  border:none;
  padding:8px 14px;
  border-radius:6px;
  cursor:pointer;
  font-size:12px;
}
.action-bar button:hover{
  background:#1e293b;
}

/* TABLE */
.table-wrapper{
  background:#fff;
  border-radius:10px;
  box-shadow:0 6px 18px rgba(0,0,0,.08);
  overflow:auto;
}
table{
  width:100%;
  border-collapse:collapse;
  font-size:13px;
}
thead{
  background:#0f172a;
  color:#fff;
}
th, td{
  padding:10px 12px;
  border-bottom:1px solid #e5e7eb;
  white-space:nowrap;
}
th{
  cursor:pointer;
  position:relative;
}
th::after{
  content:"⇅";
  font-size:10px;
  position:absolute;
  right:8px;
  opacity:.6;
}
tbody tr:hover{ background:#f9fafb; }

/* NEW ALARM HIGHLIGHT */
tr.new-alarm{
  background:#fff7cc !important;
  animation: blink 1s ease-in-out 2;
}
@keyframes blink{
  0%{background:#fff7cc;}
  50%{background:#ffef99;}
  100%{background:#fff7cc;}
}

.footer{
  margin-top:10px;
  font-size:11px;
  color:#6b7280;
}
</style>
</head>

<body>

<div class="header">
  <h1>HELPDESK VIP & HOTSPOT REALTIME ALARM V2</h1>
  <div class="update" id="lastUpdate">UPDATE : -</div>
  <div class="footer">AZH AUTO MONITORING SYSTEM</div>
</div>

<div class="container">

  <div class="action-bar">
    <button onclick="exportCSV()">Export CSV</button>
  </div>

  <div class="table-wrapper">
    <table id="alarmTable">
      <thead>
        <tr>
          <th data-key="Source">MAE</th>
          <th data-key="First Occurred (NT)">First Occurred</th>
          <th data-key="Alarm Source">Site Name</th>
          <th data-key="Name">Alarm Name</th>
          <th data-key="Escalate to">Escalate to</th>
          <th data-key="TT">TT</th>
          <th data-key="WO">WO</th>
          <th data-key="Updated At">Updated At</th>
          <th data-key="MO Name">MO Location</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <div class="footer">
    Data source: Google Sheets (Realtime CSV)
  </div>
</div>

<audio id="alarmSound">
  <source src="https://actions.google.com/sounds/v1/alarms/beep_short.ogg" type="audio/ogg">
</audio>

<script>
const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSxUQUmAg4r0EtSRceK-GNihZ2dnWtn-DPFERHStdFM8RLafRn1uX9pmzFL9KyPCJIIax9lqo83FcE6/pub?gid=420674249&single=true&output=csv&v=" + Date.now();

let tableData = [];
let sortState = {};
let previousKeys = new Set();

function alarmKey(r){
  return `${r["Source"]}|${r["First Occurred (NT)"]}|${r["Name"]}`;
}

function sortByFirstOccurredDesc(data){
  data.sort((a,b)=> new Date(b["First Occurred (NT)"]) - new Date(a["First Occurred (NT)"]));
}

function loadData(){
  Papa.parse(CSV_URL,{
    download:true,
    header:true,
    skipEmptyLines:true,
    complete:(res)=>{
      tableData = res.data;
      sortByFirstOccurredDesc(tableData);

      const newKeys = new Set();
      let newAlarmFound = false;

      tableData.forEach(r=>{
        const key = alarmKey(r);
        newKeys.add(key);
        if(!previousKeys.has(key)){
          r.__new = true;
          newAlarmFound = true;
        }else{
          r.__new = false;
        }
      });

      if(newAlarmFound){
        document.getElementById("alarmSound").play();
      }

      previousKeys = newKeys;
      renderTable(tableData);
      setLastUpdate(tableData);
    }
  });
}

function renderTable(data){
  const tbody = document.querySelector("#alarmTable tbody");
  tbody.innerHTML="";
  data.forEach(r=>{
    const tr=document.createElement("tr");
    if(r.__new) tr.classList.add("new-alarm");
    tr.innerHTML=`
      <td>${r["Source"]||"-"}</td>
      <td>${r["First Occurred (NT)"]||"-"}</td>
      <td>${r["Alarm Source"]||"-"}</td>
      <td>${r["Name"]||"-"}</td>
      <td>${r["Escalate to"]||"-"}</td>
      <td>${r["TT"]||"-"}</td>
      <td>${r["WO"]||"-"}</td>
      <td>${r["Updated At"]||"-"}</td>
      <td>${r["MO Name"]||"-"}</td>
    `;
    tbody.appendChild(tr);
  });
}

function setLastUpdate(data){
  const last = new Date();
  document.getElementById("lastUpdate").innerText = "UPDATE : " + last.toLocaleString();
}

/* EXPORT CSV */
function exportCSV(){
  const csv = Papa.unparse(tableData);
  const blob = new Blob([csv],{type:"text/csv"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download=`HELPDESK_ALARM_${new Date().toISOString().replace(/[:T]/g,"-").slice(0,19)}.csv`;
  a.click();
}

loadData();
setInterval(loadData, 4*60*1000);
</script>

</body>
</html>
