<!DOCTYPE html>
<html>

<head>

<title>NETDRONE VIP JAYA</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<link rel="stylesheet"
href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.css"/>

<link rel="stylesheet"
href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.Default.css"/>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster/dist/leaflet.markercluster.js"></script>

<style>

body{
margin:0;
font-family:Segoe UI;
background:#0b1220;
color:white
}

.header{
background:#020617;
padding:12px 20px;
font-size:20px;
font-weight:700
}

.controls{
display:flex;
gap:10px;
padding:10px;
background:#020617
}

.controls input,.controls select{
padding:6px 10px;
background:#0f172a;
border:1px solid #1e293b;
color:white;
border-radius:4px
}

.dashboard{
display:flex;
gap:16px;
padding:14px 20px;
background:#020617;
border-bottom:1px solid #1e293b
}

.card{
flex:1;
text-align:center;
padding:14px;
border-radius:10px;
font-weight:600;
box-shadow:0 0 6px rgba(0,0,0,0.4)
}

.card-title{
font-size:12px;
letter-spacing:1px;
opacity:.8;
margin-bottom:6px
}

.card-value{
font-size:26px;
font-weight:700
}

.green{background:#16a34a}
.red{background:#dc2626}
.orange{background:#f97316}
.yellow{background:#eab308}

#map{
height:82vh
}

.legend{
position:absolute;
bottom:20px;
right:20px;
background:#020617;
padding:10px 16px;
border-radius:8px;
font-size:14px;
display:flex;
gap:18px;
align-items:center;
box-shadow:0 0 8px rgba(0,0,0,0.4);
}

.blink{
animation: blink 1s infinite
}

@keyframes blink{
0%{opacity:1}
50%{opacity:.3}
100%{opacity:1}
}

/* TOAST ALERT */

#toast{
position:absolute;
top:90px;
left:50%;
transform:translateX(-50%);
background:#dc2626;
padding:12px 20px;
border-radius:6px;
display:none;
font-size:13px;
font-weight:600;
box-shadow:0 0 10px rgba(0,0,0,0.6)
}

/* FAULT PANEL */

.faultPanel{

position:absolute;
top:200px;
right:20px;

width:300px;

background:#020617;
border:1px solid #1e293b;
border-radius:10px;

padding:14px;

font-size:14px;

max-height:460px;
overflow:auto;

box-shadow:0 0 12px rgba(0,0,0,0.7);

z-index:1000;

}

.faultTitle{

font-weight:700;

font-size:15px;

color:#ff4d4d;

margin-bottom:12px;

border-bottom:1px solid #1e293b;

padding-bottom:6px;

letter-spacing:.5px;

}

.faultItem{

padding:10px 0;

border-bottom:1px solid #1e293b

}

.faultSite{

font-weight:700;

font-size:14px;

color:#ffffff;

}

.faultNode{

font-size:13px;

color:#cbd5f5;

margin-top:2px;

}

.faultAlarm{

color:#ff5c5c;

font-size:13px;

margin-top:4px;

font-weight:600;

}

</style>

</head>

<body>

<div class="header">
NETDRONE VIP JAYA HD DIOC
</div>

<div class="controls">

<input id="search" placeholder="Search Site / Node">

<select id="categoryFilter">
<option value="ALL">All Category</option>
</select>

</div>

<div class="dashboard">

<div class="card green">
<div class="card-title">CLEAR</div>
<div class="card-value" id="clear">0</div>
</div>

<div class="card red">
<div class="card-title">FAULT</div>
<div class="card-value" id="fault">0</div>
</div>

<div class="card orange">
<div class="card-title">DEGRADED</div>
<div class="card-value" id="degrade">0</div>
</div>

<div class="card yellow">
<div class="card-title">TWAMP</div>
<div class="card-value" id="twamp">0</div>
</div>

</div>

<div id="map"></div>

<div id="toast"></div>

<div class="faultPanel">

<div class="faultTitle">
ACTIVE NETWORK FAULT
</div>

<div id="faultList"></div>

</div>

<div class="legend">

<div style="display:flex;align-items:center;gap:6px">
<div style="width:14px;height:14px;background:#16a34a;border-radius:50%"></div>
Clear
</div>

<div style="display:flex;align-items:center;gap:6px">
<div style="width:14px;height:14px;background:#dc2626;border-radius:50%"></div>
Fault
</div>

<div style="display:flex;align-items:center;gap:6px">
<div style="width:14px;height:14px;background:#f97316;border-radius:50%"></div>
Degraded
</div>

<div style="display:flex;align-items:center;gap:6px">
<div style="width:14px;height:14px;background:#eab308;border-radius:50%"></div>
TWAMP
</div>

</div>

<audio id="alarmSound">
<source src="https://actions.google.com/sounds/v1/alarms/beep_short.ogg">
</audio>

<script>

const API="https://api.azhautomation.com/api/map"

var map=L.map('map',{zoomControl:true}).setView([-6.2,106.8],11)

L.tileLayer(
'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
{maxZoom:19}
).addTo(map)

var allSites=[]
var markers=[]

/* NEW VARIABLES */

var previousStatus={}
var activeFaults={}

function showToast(msg){

let t=document.getElementById("toast")

t.innerHTML=msg
t.style.display="block"

setTimeout(()=>{
t.style.display="none"
},4000)

}

function playAlarm(){

let audio = document.getElementById("alarmSound")

audio.volume = 0.2   // volume 20%

audio.currentTime = 0
audio.play()

setTimeout(()=>{
audio.currentTime = 0
audio.play()
},350)

}

function updateFaultPanel(){

let panel=document.getElementById("faultList")

panel.innerHTML=""

Object.values(activeFaults).forEach(f=>{

panel.innerHTML+=`

<div class="faultItem">

<div class="faultSite">${f.site}</div>

<div>${f.node}</div>

<div class="faultAlarm">${f.alarm}</div>

</div>

`

})

}

function color(status){

if(status=="GREEN") return "#16a34a"
if(status=="RED") return "#dc2626"
if(status=="ORANGE") return "#f97316"
if(status=="YELLOW") return "#eab308"

}

function statusText(s){

if(s=="GREEN") return "CLEAR"
if(s=="RED") return "FAULT"
if(s=="ORANGE") return "SERVICE DEGRADED"
if(s=="YELLOW") return "TWAMP ISSUE"

}

function drawSites(list){

markers.forEach(m=>map.removeLayer(m))
markers=[]

list.forEach(s=>{

let lat=Number(s.lat)
let lon=Number(s.lon)

if(isNaN(lat)||isNaN(lon))return

let blink = s.status=="RED" ? "blink" : ""

var icon=L.divIcon({

className:"",

html:`<div class="${blink}" style="
width:13px;
height:13px;
background:${color(s.status)};
border-radius:50%;
border:2px solid white;
box-shadow:0 0 4px rgba(0,0,0,0.6);
"></div>`

})

var marker=L.marker([lat,lon],{icon:icon})

let alarms="None"

if(s.alarms && s.alarms.length>0){
alarms=s.alarms.join("<br>")
}

let popup=`

<div style="font-size:12px">

<b>SITE INFORMATION</b><br>
${s.site_id}<br>
${s.node_name}<br>
${s.category ?? "-"}<br><br>

<b>STATUS</b><br>
<span style="color:${color(s.status)}">
${statusText(s.status)}
</span><br><br>

<b>ACTIVE ALARMS</b><br>
${alarms}<br><br>

<b>KPI</b><br>
PLR : ${s.kpi?.plr ?? "-"}<br>
Delay : ${s.kpi?.delay ?? "-"}

</div>

`

marker.bindPopup(popup)

marker.addTo(map)

markers.push(marker)

})

}

function applyFilter(){

let text=document.getElementById("search").value.toLowerCase()
let cat=document.getElementById("categoryFilter").value

let filtered=allSites.filter(s=>{

let a=s.site_id.toLowerCase().includes(text)
let b=s.node_name.toLowerCase().includes(text)

let search=(a||b)
let category=(cat=="ALL"||s.category==cat)

return search && category

})

drawSites(filtered)

if(filtered.length==1){

map.setView([filtered[0].lat,filtered[0].lon],15)

}

}

async function load(){

let r=await fetch(API)
let data=await r.json()

allSites=data.sites

/* INITIAL FAULT LOAD */

if(Object.keys(activeFaults).length==0){

allSites.forEach(s=>{

if(s.status!="GREEN"){

activeFaults[s.site_id]={
site:s.site_id,
node:s.node_name,
alarm:(s.alarms && s.alarms.length>0)?s.alarms[0]:"KPI DEGRADED"
}

}

})

updateFaultPanel()

}

/* DETECT STATUS CHANGE */

allSites.forEach(s=>{

let prev=previousStatus[s.site_id]

if(prev=="GREEN" && s.status!="GREEN"){

showToast("⚠ SITE ISSUE : "+s.site_id)

playAlarm()

activeFaults[s.site_id]={
site:s.site_id,
node:s.node_name,
alarm:(s.alarms && s.alarms.length>0)?s.alarms[0]:"KPI DEGRADED"
}

updateFaultPanel()

}

if(prev && prev!="GREEN" && s.status=="GREEN"){

delete activeFaults[s.site_id]

updateFaultPanel()

}

previousStatus[s.site_id]=s.status

})

document.getElementById("clear").innerHTML=data.summary.green
document.getElementById("fault").innerHTML=data.summary.red
document.getElementById("degrade").innerHTML=data.summary.orange
document.getElementById("twamp").innerHTML=data.summary.yellow

let cats=[...new Set(allSites.map(s=>s.category))]

let sel=document.getElementById("categoryFilter")

sel.innerHTML='<option value="ALL">All Category</option>'

cats.forEach(c=>{
sel.innerHTML+=`<option value="${c}">${c}</option>`
})

drawSites(allSites)

}

document.getElementById("search").addEventListener("keyup",applyFilter)
document.getElementById("categoryFilter").addEventListener("change",applyFilter)

load()

setInterval(load,30000)

</script>

</body>
</html>
