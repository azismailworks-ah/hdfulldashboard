<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NETDRONE VIP · NOC Indonesia</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--bg:#06101d;--panel:#0b1829f2;--line:#233a54;--text:#eef6ff;--muted:#8da2b9;--cyan:#38d6ff;--green:#29d39a;--red:#ff405c;--orange:#ff8c42;--yellow:#ffd43b}*{box-sizing:border-box}html,body,#map{height:100%;margin:0}body{font:13px Inter,Segoe UI,sans-serif;background:var(--bg);color:var(--text);overflow:hidden}#map{background:#071321}.leaflet-tile{filter:saturate(.55) brightness(.7) contrast(1.1)}.glass{background:linear-gradient(140deg,#0d1b2ff2,#071321e8);border:1px solid var(--line);box-shadow:0 18px 55px #0009;backdrop-filter:blur(14px)}.header{position:fixed;z-index:900;left:16px;right:16px;top:16px;border-radius:18px;padding:14px}.topline{display:flex;align-items:center;gap:14px}.brand{min-width:250px}.brand b{font-size:16px;letter-spacing:.12em}.brand b em{font-style:normal;color:var(--cyan)}.brand small{display:block;color:var(--muted);margin-top:5px}.live{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 5px #29d39a20;margin-right:7px}.filters{display:flex;gap:8px;flex:1}.filters input,.filters select{height:38px;background:#061225;border:1px solid var(--line);border-radius:10px;color:var(--text);padding:0 12px;outline:none}.filters input{flex:1}.filters select{min-width:145px}.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;margin-top:12px}.card{background:#071528;border:1px solid #1c344f;border-radius:12px;padding:9px 12px;position:relative;overflow:hidden}.card:before{content:"";position:absolute;inset:0 auto 0 0;width:3px;background:var(--green)}.card.red:before{background:var(--red)}.card.orange:before{background:var(--orange)}.card.yellow:before{background:var(--yellow)}.card label{display:block;color:var(--muted);font-size:9px;letter-spacing:.12em}.card strong{font-size:23px;display:block;margin-top:3px}.red strong{color:var(--red)}.orange strong{color:var(--orange)}.yellow strong{color:var(--yellow)}.side{position:fixed;z-index:850;right:16px;top:181px;bottom:18px;width:350px;border-radius:17px;display:flex;flex-direction:column;overflow:hidden}.side header{padding:15px;border-bottom:1px solid var(--line)}.side header b{letter-spacing:.07em}.side header span{float:right;color:var(--muted);font-size:11px}.source{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:9px 12px;border-bottom:1px solid var(--line);font-size:10px;color:var(--muted)}.source div{background:#061225;padding:7px;border-radius:7px}.list{padding:8px;overflow:auto}.issue{background:#071528;border:1px solid #1c344f;border-radius:10px;padding:10px;margin-bottom:7px;cursor:pointer}.issue:hover{border-color:#4f799f}.issue b{font-size:12px}.issue p{color:var(--muted);font-size:11px;line-height:1.45;margin:5px 0 0}.tag{float:right;border-radius:6px;padding:4px 6px;font-size:9px;font-weight:800}.tag.CRITICAL{background:#ff405c30;color:#ff9cac}.tag.SIA{background:#ff8c4230;color:#ffc195}.tag.KPI{background:#ffd43b28;color:#ffe77f}.dot{width:15px;height:15px;border:2px solid white;border-radius:50%;box-shadow:0 0 0 4px #fff2}.dot.CLEAR{background:var(--green)}.dot.CRITICAL{background:var(--red);animation:pulse 1.2s infinite}.dot.SIA{background:var(--orange)}.dot.KPI{background:var(--yellow)}@keyframes pulse{50%{transform:scale(1.45);opacity:.55}}.popup{min-width:255px;color:#172337}.popup h3{margin:0}.popup .meta{font-size:11px;color:#65758a}.popup section{border-top:1px solid #dbe3ec;margin-top:9px;padding-top:8px}.popup p{font-size:12px;line-height:1.45}.empty{text-align:center;color:var(--muted);padding:35px 10px}.error{color:#ff9cac!important}@media(max-width:850px){.header{left:7px;right:7px;top:7px}.topline{flex-wrap:wrap}.brand{min-width:100%}.filters{flex-wrap:wrap}.filters input{min-width:100%}.cards{grid-template-columns:repeat(3,1fr)}.side{left:7px;right:7px;bottom:7px;top:auto;width:auto;height:220px}}
.cards{grid-template-columns:repeat(6,1fr)}.card.cyan:before{background:var(--cyan)}.card.cyan strong{color:var(--cyan)}.alarm-line{display:block;margin-top:3px}.alarm-time{color:#b6c6d8}
</style></head><body>
<div id="map"></div>
<section class="header glass"><div class="topline"><div class="brand"><b>NETDRONE <em>VIP</em> · NOC</b><small><span class="live"></span><span id="state">Menghubungkan data nasional…</span></small></div><div class="filters"><input id="search" placeholder="Cari Site ID atau nama site"><select id="circle"><option value="ALL">Semua Circle</option></select><select id="vip"><option value="ALL">Semua VIP</option><option value="VIP">VIP</option><option value="SUPER VIP">Super VIP</option><option value="HOTSPOT">HotSpot</option></select></div></div><div class="cards"><div class="card"><label>TOTAL SITE</label><strong id="total">0</strong></div><div class="card cyan"><label>HYGIENE SITE</label><strong id="hygiene">0</strong></div><div class="card red"><label>NE DOWN</label><strong id="ne">0</strong></div><div class="card red"><label>CELL DOWN</label><strong id="cell">0</strong></div><div class="card orange"><label>SIA IMPACT</label><strong id="sia">0</strong></div><div class="card yellow"><label>TWAMP ISSUE</label><strong id="kpi">0</strong></div></div></section>
<aside class="side glass"><header><b>ACTIVE ISSUE</b><span id="issueCount">0 site</span></header><div class="source"><div>OWS · 5 menit<br><b id="alarmTime">—</b></div><div>TWAMP · 15 menit<br><b id="twampTime">—</b></div></div><div class="list" id="issues"><div class="empty">Menunggu snapshot…</div></div></aside>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const API='https://api.azhautomation.com/api/map/vip',color={CRITICAL:'#ff405c',SIA:'#ff8c42',KPI:'#ffd43b',CLEAR:'#29d39a'};let sites=[],markers=new Map(),loading=false;
const map=L.map('map',{zoomControl:false,preferCanvas:true}).setView([-2.4,118],5);L.control.zoom({position:'bottomleft'}).addTo(map);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'© OpenStreetMap'}).addTo(map);
const esc=v=>String(v??'—').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));const fmt=v=>v?new Date(v).toLocaleString('id-ID'):'—';
function alarmTime(v){if(!v||v==='-')return 'waktu tidak tersedia';let raw=v;if(/^\d{10,13}$/.test(String(v).trim())){const n=Number(v);raw=String(v).trim().length===10?n*1000:n}const d=new Date(raw);if(!Number.isNaN(d.getTime()))return new Intl.DateTimeFormat('en-GB',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit',hour12:false,timeZone:'Asia/Jakarta'}).format(d).replace(',','');const m=String(v).match(/(\d{4})[-/](\d{1,2})[-/](\d{1,2})[ T](\d{1,2}):(\d{2})/);return m?`${m[3].padStart(2,'0')}/${m[2].padStart(2,'0')}/${m[1]} ${m[4].padStart(2,'0')}:${m[5]}`:String(v)}
function ticketWorkOrder(s){const alarms=s.alarms||[],tt=alarms.map(a=>a.ticket_id).find(Boolean),wo=alarms.map(a=>a.work_order).find(Boolean);return `${tt||'No TT'} - ${wo||'No WO'}`}
function popup(s){const alarms=s.alarms?.length?s.alarms.map(a=>`<p><b>${esc(a.scenario.replaceAll('_',' '))}</b><br>${esc(a.name)} (${esc(alarmTime(a.start_time))})<br><span class="meta">${esc(a.node)}</span></p>`).join(''):'<p>Tidak ada alarm RAN aktif.</p>';return `<div class="popup"><h3>${esc(s.site_id)} - ${esc(s.site_name)}</h3><div class="meta">${esc(s.circle)} · ${esc(s.vip_type)}</div><section><b>ACTIVE RAN ALARM</b>${alarms}</section><section><b>TWAMP REALTIME</b><p>PLR ${esc(s.kpi?.plr)}% · Delay ${esc(s.kpi?.delay)} ms<br>Threshold ${esc(s.kpi?.delay_threshold)} ms<br><span class="meta">Data ${esc(s.kpi?.timestamp)}</span></p></section></div>`}
function selected(){const q=document.querySelector('#search').value.trim().toLowerCase(),c=document.querySelector('#circle').value,v=document.querySelector('#vip').value;return sites.filter(s=>(!q||`${s.site_id} ${s.site_name}`.toLowerCase().includes(q))&&(c==='ALL'||s.circle===c)&&(v==='ALL'||s.vip_type===v))}
function render(){const shown=selected(),ids=new Set(shown.map(s=>s.site_id));markers.forEach((m,id)=>{if(!ids.has(id)&&map.hasLayer(m))map.removeLayer(m)});shown.forEach(s=>{let m=markers.get(s.site_id),icon=L.divIcon({className:'',html:`<div class="dot ${s.status}"></div>`,iconSize:[15,15]});if(!m){m=L.marker([s.lat,s.lon],{icon});markers.set(s.site_id,m)}else m.setLatLng([s.lat,s.lon]).setIcon(icon);m.bindPopup(popup(s)).addTo(map)});const issue=shown.filter(s=>s.status!=='CLEAR').sort((a,b)=>['CRITICAL','SIA','KPI'].indexOf(a.status)-['CRITICAL','SIA','KPI'].indexOf(b.status));document.querySelector('#issueCount').textContent=`${issue.length} site`;document.querySelector('#issues').innerHTML=issue.length?issue.map(s=>{const details=s.alarms?.length?s.alarms.map(a=>`<span class="alarm-line">${esc(a.name)} <span class="alarm-time">(${esc(alarmTime(a.start_time))})</span></span>`).join(''):`<span class="alarm-line">TWAMP PLR ${esc(s.kpi?.plr)}% / Delay ${esc(s.kpi?.delay)} ms <span class="alarm-time">(${esc(alarmTime(s.kpi?.timestamp))})</span></span>`;return `<div class="issue" data-id="${esc(s.site_id)}"><span class="tag ${s.status}">${s.status}</span><b>${esc(s.site_id)} - ${esc(s.site_name)}</b><span class="alarm-line alarm-time">${esc(ticketWorkOrder(s))}</span><p>${esc(s.circle)} · ${esc(s.vip_type)}<br>${details}</p></div>`}).join(''):'<div class="empty">Tidak ada issue pada filter aktif.</div>';document.querySelectorAll('.issue').forEach(el=>el.onclick=()=>{const m=markers.get(el.dataset.id);if(m){map.flyTo(m.getLatLng(),13);m.openPopup()}});document.querySelector('#total').textContent=shown.length;document.querySelector('#hygiene').textContent=shown.filter(s=>!(s.alarms?.length)&&!s.kpi?.issue).length;document.querySelector('#ne').textContent=shown.filter(s=>s.alarms?.some(a=>a.scenario==='NE_DOWN')).length;document.querySelector('#cell').textContent=shown.filter(s=>s.alarms?.some(a=>a.scenario==='CELL_DOWN')).length;document.querySelector('#sia').textContent=shown.filter(s=>s.status==='SIA').length;document.querySelector('#kpi').textContent=shown.filter(s=>s.kpi?.issue).length}
async function load(){if(loading)return;loading=true;try{const r=await fetch(API,{cache:'no-store'}),d=await r.json();if(Array.isArray(d.sites))sites=d.sites;const circles=[...new Set(sites.map(s=>s.circle))].sort(),select=document.querySelector('#circle'),keep=select.value;select.innerHTML='<option value="ALL">Semua Circle</option>'+circles.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('');select.value=circles.includes(keep)?keep:'ALL';document.querySelector('#alarmTime').textContent=fmt(d.source_updates?.alarms);document.querySelector('#twampTime').textContent=d.source_updates?.twamp_progress?`proses ${d.source_updates.twamp_progress}`:fmt(d.source_updates?.twamp);const errs=Object.entries(d.errors||{});document.querySelector('#state').textContent=errs.length?`${errs[0][0]}: ${errs[0][1]}`:`Live snapshot · update ${fmt(d.last_update)}`;document.querySelector('#state').className=errs.length?'error':'';render()}catch(e){document.querySelector('#state').textContent='API tidak dapat dihubungi';document.querySelector('#state').className='error'}finally{loading=false}}
['search','circle','vip'].forEach(id=>document.querySelector('#'+id).addEventListener(id==='search'?'input':'change',render));load();setInterval(load,60000);
</script></body></html>
