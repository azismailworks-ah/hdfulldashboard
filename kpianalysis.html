<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>HD – Customer Complaint KPI Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box}
body{
margin:0;
font-family:Inter;
background:#020617;
color:#e2e8f0;
overflow-x:hidden;
}

/* ===== Animated Background ===== */
body:before{
content:"";
position:fixed;
top:-50%;
left:-50%;
width:200%;
height:200%;
background:conic-gradient(
from 180deg,
#0ea5e9,
#8b5cf6,
#ec4899,
#0ea5e9
);
animation:spin 18s linear infinite;
opacity:.08;
z-index:-1;
}
@keyframes spin{
100%{transform:rotate(360deg)}
}

/* HEADER */
.header{
display:flex;
justify-content:space-between;
align-items:center;
padding:25px 60px;
border-bottom:1px solid #0ea5e9;
}

.header-left{
display:flex;
align-items:center;
gap:25px;
}

.header-left img{height:110px}
.header-right img{height:50px}

.header-title{
font-size:28px;
font-weight:700;
background:linear-gradient(90deg,#22d3ee,#a855f7);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

/* CONTROLS */
.controls{
padding:20px 60px;
display:flex;
gap:12px;
align-items:center;
}

input{
background:#0f172a;
border:1px solid #334155;
padding:8px 12px;
border-radius:8px;
color:#fff;
}

button{
padding:8px 18px;
border-radius:8px;
border:none;
font-weight:600;
cursor:pointer;
background:linear-gradient(90deg,#06b6d4,#22c55e);
color:white;
transition:.3s;
}

button:hover{
box-shadow:0 0 20px #22d3ee;
transform:translateY(-2px);
}

/* TITLE */
.kpi-title{
text-align:center;
font-size:22px;
margin:10px 0 25px;
color:#22d3ee;
}

/* SUMMARY */
.summary{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:22px;
padding:0 60px 25px;
}

.summary-card{
background:#0f172a;
border-radius:18px;
padding:22px;
text-align:center;
border:1px solid rgba(168,85,247,.4);
box-shadow:0 0 35px rgba(168,85,247,.25);
transition:.3s;
}

.summary-card:hover{
transform:translateY(-5px);
box-shadow:0 0 45px rgba(168,85,247,.6);
}

.summary-value{
font-size:34px;
font-weight:700;
}

.summary-title{color:#94a3b8}
.summary-status{margin-top:8px;font-weight:700}

.good{color:#22c55e}
.warn{color:#f59e0b}
.bad{color:#ef4444}
.na{color:#94a3b8}

/* ===== GRID UPDATED: 2 PER ROW ===== */
.grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:30px;
padding:0 60px 60px;
}

/* ===== CARD UPDATED: NO SHADOW ===== */
.card{
background:#0f172a;
border-radius:20px;
padding:20px;
border:1px solid rgba(34,211,238,.4);
box-shadow:none; /* SHADOW REMOVED */
position:relative;
overflow:hidden;
}

/* REMOVE MOVING GLOW EFFECT */
.card:before{
display:none;
}

.card h3{
color:#22d3ee;
font-size:15px;
margin-bottom:15px;
}

/* ===== CHART ENLARGED ===== */
canvas{
height:420px!important;
}

/* Responsive */
@media(max-width:1200px){
.grid{grid-template-columns:1fr}
.summary{grid-template-columns:1fr 1fr}
}

.analysis-summary{
  background:#020617;
  border-left:4px solid #22d3ee;
  padding:10px;
  border-radius:8px;
}

</style>
</head>

<body>

<div class="header">
<div class="header-left">
<img src="./hd_logo.png">
<div class="header-title">HD – Customer Complaint KPI Dashboard</div>
</div>
<div class="header-right">
<img src="./indosat.png">
</div>
</div>

<div class="controls">
<input id="siteId" value="21TML0001">
<input id="days" type="number" value="30">
<button onclick="loadData()">Analyze</button>
<button onclick="exportDashboard()">Export PNG</button>
<button onclick="toggleFullscreen()">Fullscreen</button>
<button onclick="toggleAutoRefresh()">Auto Refresh</button>
</div>

<div id="kpiTitle" class="kpi-title"></div>

<div class="summary">
<div class="summary-card">
<div class="summary-title">Availability</div>
<div id="sumAvail" class="summary-value">-</div>
<div id="statAvail" class="summary-status na">-</div>
</div>

<div class="summary-card">
<div class="summary-title">Delay</div>
<div id="sumDelay" class="summary-value">-</div>
<div id="statDelay" class="summary-status na">-</div>
</div>

<div class="summary-card">
<div class="summary-title">PLR</div>
<div id="sumPLR" class="summary-value">-</div>
<div id="statPLR" class="summary-status na">-</div>
</div>

<div class="summary-card">
<div class="summary-title">PRB Peak</div>
<div id="sumPRB" class="summary-value">-</div>
<div id="statPRB" class="summary-status na">-</div>
</div>
</div>

<div class="grid">
<div class="card"><h3>KPI Availability & Traffic</h3><canvas id="chart1"></canvas></div>
<div class="card"><h3>KPI Delay & PLR</h3><canvas id="chart2"></canvas></div>
<div class="card"><h3>PRB Utilization</h3><canvas id="chart3"></canvas></div>
<div class="card"><h3>4G Data Traffic</h3><canvas id="chart4"></canvas></div>
<div class="card"><h3>Average TA</h3><canvas id="chart5"></canvas></div>
<div class="card"><h3>UL RSSI</h3><canvas id="chart6"></canvas></div>
<div class="card"><h3>Connected User</h3><canvas id="chart7"></canvas></div>
<div class="card"><h3>Throughput</h3><canvas id="chart8"></canvas></div>
<div class="card"><h3>S1 Signaling Success Rate</h3><canvas id="chart9"></canvas></div>
</div>

<div id="analysisPanel" style="padding:40px 60px;">
  <div class="card">
    <h3>🧠 AUTO KPI ANALYSIS</h3>
    <div id="analysisContent">Click Analyze...</div>
  </div>
</div>

<script>
Chart.defaults.color="#cbd5e1";
Chart.defaults.borderColor="rgba(148,163,184,.2)";
Chart.defaults.font.family="Inter";
Chart.defaults.font.size = 10;

Chart.defaults.scales.category.ticks.font = {
  size:10
};

Chart.defaults.elements.line.borderWidth = 2;  // 🔥 semua line jadi tipis
Chart.defaults.elements.point.radius = 1;        // 🔥 hilangkan titik

/* Fullscreen */
function toggleFullscreen(){
if(!document.fullscreenElement){
document.documentElement.requestFullscreen();
}else{
document.exitFullscreen();
}
}

/* Auto Refresh */
function toggleAutoRefresh(){
if(autoRefresh){
clearInterval(autoRefresh);
autoRefresh=null;
alert("Auto refresh OFF");
}else{
autoRefresh=setInterval(loadData,300000);
alert("Auto refresh ON (5 min)");
}
}

/* Dark Export */
async function exportDashboard(){
const target=document.body;
await html2canvas(target,{
scale:2,
backgroundColor:"#020617"
}).then(canvas=>{
const link=document.createElement("a");
link.href=canvas.toDataURL("image/png");
link.download="HD_KPI_Dashboard.png";
link.click();
});
}

const API = "https://api.azhautomation.com/api/kpi";
let c1,c2,c3,c4, c5, c6, c7, c8, c9;

function num(v){
  const n = Number(v);
  return isNaN(n) ? 0 : n;
}
function pct(v){
  return num(v) * 100;
}
// === KHUSUS LINE CHART (AMAN) ===
function numLine(v){
  if(v === null || v === undefined || v === "" || v === "NA") return null;
  const n = Number(v);
  return isNaN(n) ? null : n;
}

function pctLine(v){
  const n = numLine(v);
  return n === null ? null : n * 100;
}

function destroy(){
  [c1,c2,c3,c4,c5,c6,c7,c8,c9].forEach(c=>{if(c) c.destroy()});
}

function avg(arr){
  return arr.length ? arr.reduce((a,b)=>a+b,0)/arr.length : null;
}

function setSummary(idVal,idStat,val,status){
  const v=document.getElementById(idVal);
  const s=document.getElementById(idStat);
  v.innerText=val;
  s.innerText=status.text;
  s.className="summary-status "+status.cls;
}

function statusLabel(type,value){
  if(value===null) return {text:"INSUFFICIENT",cls:"na"};

  if(type==="avail"){
    if(value<90) return {text:"BAD",cls:"bad"};
    if(value<99) return {text:"WARNING",cls:"warn"};
    return {text:"GOOD",cls:"good"};
  }
  if(type==="delay"){
    if(value>11) return {text:"BAD",cls:"bad"};
    if(value>8) return {text:"WARNING",cls:"warn"};
    return {text:"GOOD",cls:"good"};
  }
  if(type==="plr"){
    if(value>=2) return {text:"BAD",cls:"bad"};
    if(value>1) return {text:"WARNING",cls:"warn"};
    return {text:"GOOD",cls:"good"};
  }
  if(type==="prb"){
    if(value>85) return {text:"BAD",cls:"bad"};
    if(value>75) return {text:"WARNING",cls:"warn"};
    return {text:"GOOD",cls:"good"};
  }
}

async function loadData(){
  destroy();
  const site=document.getElementById("siteId").value;
  const days=document.getElementById("days").value;

  document.getElementById("kpiTitle").innerText = `KPI Trend "${site}"`;

  const r=await fetch(`${API}?site_id=${site}&days=${days}`);
  const j=await r.json();
  if(!j.data || j.data.length===0){ alert("No data"); return; }

  // ✅ Tampilkan Site ID + Site Name
  const siteName = j.site_name || "-";
  document.getElementById("kpiTitle").innerText =
    `KPI Trend ${site} — ${siteName}`;
	
  const L=j.data.map(d=>d.time);

  // === KPI SUMMARY LOGIC ===
  const last6 = j.data.slice(-6);
  const availAvg = avg(last6.map(d=>pct(d.availability)));
  const delayAvg = avg(last6.map(d=>num(d.delay)));
  const plrAvg   = avg(last6.map(d=>num(d.plr)));
  
  const last3d = j.data.slice(-72); // asumsi hourly
  const prbMax = Math.max(...last3d.map(
    d=>Math.max(pct(d.prb_s1),pct(d.prb_s2),pct(d.prb_s3))
  ));
  
  setSummary("sumAvail","statAvail",
    availAvg?availAvg.toFixed(2)+"%":"-",
    statusLabel("avail",availAvg)
  );
  
  setSummary("sumDelay","statDelay",
    delayAvg?delayAvg.toFixed(2)+" ms":"-",
    statusLabel("delay",delayAvg)
  );
  
  setSummary("sumPLR","statPLR",
    plrAvg?plrAvg.toFixed(2)+"%":"-",
    statusLabel("plr",plrAvg)
  );
  
  setSummary("sumPRB","statPRB",
    prbMax?prbMax.toFixed(1)+"%":"-",
    statusLabel("prb",prbMax)
  );

  /* ===== BOX 1 ===== */
  c1=new Chart(chart1,{
    type:"bar",
    data:{
      labels:L,
      datasets:[
        {label:"Availability (%)",type:"line",data:j.data.map(d=>pctLine(d.availability)),borderColor:"#16a34a",yAxisID:"y1",spanGaps:false},
        {label:"LTE Traffic (GB)",data:j.data.map(d=>num(d.traffic_lte)),backgroundColor:"#93c5fd",yAxisID:"y2",stack:"traffic"},
        {label:"5G Traffic (GB)",data:j.data.map(d=>num(d.traffic_5g)),backgroundColor:"#2563eb",yAxisID:"y2",stack:"traffic"}
      ]
    },
    options:{
      scales:{
        y1:{min:0,max:100,ticks:{callback:v=>v+"%"},title:{display:true,text:"Availability (%)"}},
        y2:{beginAtZero:true,stacked:true,position:"right",grid:{drawOnChartArea:false},title:{display:true,text:"Traffic (GB)"}}
      }
    }
  });

  /* ===== BOX 2 ===== */
  c2=new Chart(chart2,{
    type:"bar",
    data:{
      labels:L,
      datasets:[
        {label:"Delay (ms)",type:"line",data:j.data.map(d=>numLine(d.delay)),borderColor:"#dc2626",yAxisID:"y1",spanGaps:false},
        {label:"PLR (%)",data:j.data.map(d=>num(d.plr)),backgroundColor:"#f59e0b",yAxisID:"y2"}
      ]
    },
    options:{
      scales:{
         y1:{beginAtZero:true,title:{display:true,text:"Delay (ms)"}},
        y2:{beginAtZero:true,position:"right",grid:{drawOnChartArea:false},title:{display:true,text:"PLR (%)"}}
      }
    }
  });

  /* ===== BOX 3 ===== */
  c3=new Chart(chart3,{
    type:"line",
    data:{
      labels:L,
      datasets:[
        {label:"PRB S1 (%)",data:j.data.map(d=>pctLine(d.prb_s1)),borderColor:"#2563eb",spanGaps:false},
        {label:"PRB S2 (%)",data:j.data.map(d=>pctLine(d.prb_s2)),borderColor:"#16a34a",spanGaps:false},
        {label:"PRB S3 (%)",data:j.data.map(d=>pctLine(d.prb_s3)),borderColor:"#dc2626",spanGaps:false}
      ]
    },
    options:{
      scales:{
        y:{min:0,max:100,ticks:{callback:v=>v+"%"},title:{display:true,text:"PRB Utilization (%)"}}
      }
    }
  });
  
    /* ===== BOX 4 ===== */
  c4 = new Chart(chart4,{
    type:"line",
    data:{
      labels:L,
      datasets:[
        {label:"Sector 1",data:j.data.map(d=>numLine(d.traffic4g_s1)),borderColor:"#2563eb",spanGaps:false},
        {label:"Sector 2",data:j.data.map(d=>numLine(d.traffic4g_s2)),borderColor:"#16a34a",spanGaps:false},
        {label:"Sector 3",data:j.data.map(d=>numLine(d.traffic4g_s3)),borderColor:"#dc2626",spanGaps:false}
      ]
    },
    options:{
      scales:{
        y:{beginAtZero:true,title:{display:true,text:"Traffic (GB)"}}
      }
    }
  });

  /* ===== BOX 5 ===== */
  c5 = new Chart(chart5,{
    type:"line",
    data:{
      labels:L,
      datasets:[
        {label:"Sector 1",data:j.data.map(d=>numLine(d.ta_s1)),borderColor:"#2563eb"},
        {label:"Sector 2",data:j.data.map(d=>numLine(d.ta_s2)),borderColor:"#16a34a"},
        {label:"Sector 3",data:j.data.map(d=>numLine(d.ta_s3)),borderColor:"#dc2626"}
      ]
    },
    options:{
      scales:{
        y:{beginAtZero:true,title:{display:true,text:"TA"}}
      }
    }
  });

  /* ===== BOX 6 ===== */
  c6 = new Chart(chart6,{
    type:"line",
    data:{
      labels:L,
      datasets:[
        {label:"Sector 1",data:j.data.map(d=>numLine(d.ulrssi_s1)),borderColor:"#2563eb"},
        {label:"Sector 2",data:j.data.map(d=>numLine(d.ulrssi_s2)),borderColor:"#16a34a"},
        {label:"Sector 3",data:j.data.map(d=>numLine(d.ulrssi_s3)),borderColor:"#dc2626"}
      ]
    },
    options:{
      scales:{
        y:{title:{display:true,text:"UL RSSI (dBm)"}}
      }
    }
  });

  /* ===== BOX 7 ===== */  
  c7 = new Chart(chart7,{
    type:"line",
    data:{
      labels:L,
      datasets:[
        {label:"Sector 1",data:j.data.map(d=>numLine(d.rrc_user_s1)),borderColor:"#2563eb"},
        {label:"Sector 2",data:j.data.map(d=>numLine(d.rrc_user_s2)),borderColor:"#16a34a"},
        {label:"Sector 3",data:j.data.map(d=>numLine(d.rrc_user_s3)),borderColor:"#dc2626"}
      ]
    },
    options:{
      scales:{
        y:{beginAtZero:true,title:{display:true,text:"Connected User"}}
      }
    }
  });

  /* ===== BOX 8 ===== */ 
  c8 = new Chart(chart8,{
    type:"line",
    data:{
      labels:L,
      datasets:[
        {label:"Sector 1",data:j.data.map(d=>numLine(d.thp_s1)),borderColor:"#2563eb"},
        {label:"Sector 2",data:j.data.map(d=>numLine(d.thp_s2)),borderColor:"#16a34a"},
        {label:"Sector 3",data:j.data.map(d=>numLine(d.thp_s3)),borderColor:"#dc2626"}
      ]
    },
    options:{
      scales:{
        y:{beginAtZero:true,title:{display:true,text:"Throughput (Mbps)"}}
      }
    }
  });
  
  /* ===== BOX 9 ===== */
  c9 = new Chart(chart9,{
    type:"line",
    data:{
      labels:L,
      datasets:[
        {
          label:"S1SR (%)",
          data:j.data.map(d=>pctLine(d.s1_sr)),
          borderColor:"#22c55e",
          spanGaps:false
        }
      ]
    },
    options:{
      scales:{
        y:{
          min:0,
          max:100,
          ticks:{callback:v=>v+"%"},
          title:{display:true,text:"S1 Signaling Success Rate (%)"}
        }
      }
    }
});

// ===== CALL ANALYSIS (NON-INTRUSIVE) =====
loadAnalysis(site, days);

}

/* ===================== EXPORT PNG ===================== */

// Export satu chart saja
function exportChart(canvasId, filename){
  const canvas = document.getElementById(canvasId);
  if(!canvas){
    alert("Canvas not found");
    return;
  }

  const link = document.createElement("a");
  link.href = canvas.toDataURL("image/png", 1.0);
  link.download = filename + ".png";
  link.click();
}

// Export seluruh dashboard
async function exportDashboard(){
  const target = document.body;

  // Hilangkan tombol sementara (agar PNG bersih)
  const buttons = document.querySelectorAll("button");
  buttons.forEach(b=>b.style.display="none");

  await html2canvas(target,{
    scale:2,                 // kualitas tinggi
    useCORS:true,
    backgroundColor:"#f4f6f9",
    windowWidth:document.body.scrollWidth,
    windowHeight:document.body.scrollHeight
  }).then(canvas=>{
    const link=document.createElement("a");
    link.href=canvas.toDataURL("image/png",1.0);
    link.download="Helpdesk_KPI_Dashboard.png";
    link.click();
  });

  // Kembalikan tombol
  buttons.forEach(b=>b.style.display="inline-block");
}

/* ================= ANALYSIS ENGINE (NEW - NON DESTRUCTIVE) ================= */

const API_ANALYSIS = "https://api.azhautomation.com/api/auto-analysis";

async function loadAnalysis(site, days){

  try{

    document.getElementById("analysisContent").innerHTML="⏳ Analyzing...";

    const r = await fetch(`${API_ANALYSIS}?site_id=${site}&days=${days}`);

    if(!r.ok){
      throw new Error("API not reachable");
    }

    const j = await r.json();

    console.log("ANALYSIS RESULT:", j);

    if(!j || !j.trend){
      document.getElementById("analysisContent").innerHTML =
        "❌ No analysis data";
      return;
    }

    let html = "";

    // ================= HEADER =================
    html += `<div class="analysis-item"><b>Root Cause:</b> ${j.root_cause}</div>`;
    html += `<div class="analysis-item"><b>Confidence:</b> ${j.confidence ?? '-'}%</div>`;
    html += `<div class="analysis-item"><b>Alarm:</b> ${j.alarm}</div>`;

    // ================= SUMMARY =================
    html += `<div class="analysis-title">Summary</div>`;
    html += `<div class="analysis-summary">${j.summary}</div>`;

    // ================= KPI SNAPSHOT (NEW) =================
    html += `<div class="analysis-title">KPI Snapshot</div>`;

    // Availability
    if(j.availability_status){
      html += `<div class="analysis-item">
        Availability : ${j.availability_status} (${j.availability_min ?? '-'}%)
      </div>`;
    }

    // PRB per sector
    if(j.sector_prb){
      html += `<div class="analysis-item">
        PRB S1 : ${j.sector_prb.S1?.toFixed(1) ?? '-'}%
      </div>`;
      html += `<div class="analysis-item">
        PRB S2 : ${j.sector_prb.S2?.toFixed(1) ?? '-'}%
      </div>`;
      html += `<div class="analysis-item">
        PRB S3 : ${j.sector_prb.S3?.toFixed(1) ?? '-'}%
      </div>`;
    }

    // ================= TREND =================
    html += `<div class="analysis-title">Trend</div>`;
    Object.entries(j.trend).forEach(([k,v])=>{
      html += `<div class="analysis-item">${k} : ${v}</div>`;
    });

    // ================= INSIGHT =================
    html += `<div class="analysis-title">Insight</div>`;
    if(j.insight && j.insight.length){
      j.insight.forEach(i=>{
        html += `<div class="analysis-item">• ${i}</div>`;
      });
    }else{
      html += `<div class="analysis-item">No insight</div>`;
    }

    document.getElementById("analysisContent").innerHTML = html;

  }catch(e){

    console.error("ANALYSIS ERROR:", e);

    document.getElementById("analysisContent").innerHTML =
      "❌ Analysis error (check console)";
  }
}

</script>

</body>
</html>
