<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NOC REALTIME ALARM CIRCLE NON JAYA</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/papaparse@5.4.1/papaparse.min.js"></script>

<style>
/* ================= BASE LAYOUT ================= */
html,body{
  height:100%;
  margin:0;
  font-family:'Inter', sans-serif;
  background:#0b1220;
  color:#e5e7eb;
}

.page{
  display:flex;
  flex-direction:column;
  height:100vh;
}

body.light{background:#f4f6f9;color:#111827}

/* ================= STICKY TOP ================= */
.top-fixed{
  flex:0 0 auto;
  position:sticky;
  top:0;
  z-index:9999;
  background:#0b1220;
}
body.light .top-fixed{background:#f4f6f9}

/* HEADER */
.header{
  background:#020617;
  padding:18px 28px;
  border-bottom:1px solid #1f2937;
  display:flex;
  justify-content:space-between;
}
body.light .header{background:#fff}

/* SEARCH */
.action-bar{
  padding:12px 20px;
}

/* KPI */
.summary-wrapper{
  display:grid;
  grid-template-columns:260px 1fr 420px;
  gap:10px;
  padding:0 20px 12px 20px;
}

.card{
  background:#020617;
  border:1px solid #1f2937;
  border-radius:8px;
  padding:12px;
}
body.light .card{background:#fff;border:1px solid #ddd}

.kpi-grid{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:6px;
}
.kpi{padding:6px;border:1px solid #1f2937;text-align:center}

.kpi.yellow{background:#fde047;color:#000}
.kpi.orange{background:#fb923c;color:#000}
.kpi.red{background:#ef4444}
.kpi.darkred{background:#7f1d1d;animation:blink 1s infinite}

/* ================= TABLE AREA ================= */
.table-wrapper{
  flex:1;
  min-height:0;
  overflow:auto;
  margin:0 20px 20px 20px;
  border:1px solid #1f2937;
}

/* sticky table header */
thead th{
  position:sticky;
  top:0;
  background:#020617;
  z-index:5;
}

table{
  width:100%;
  border-collapse:collapse;
  font-size:12px;
}

th,td{
  padding:8px;
  border-bottom:1px solid #1f2937;
}

tr.vip{background:#1e293b}

tr.age3{background:#fde047;color:#000}
tr.age7{background:#fb923c;color:#000}
tr.age14{background:#ef4444}
tr.age14p{background:#7f1d1d;animation:blink 1s infinite}

@keyframes blink{
  0%{background:#7f1d1d}
  50%{background:#dc2626}
  100%{background:#7f1d1d}
}
</style>
</head>

<body>
<div class="page">

<div class="top-fixed">

<div class="header">
  <h1>HD KSMP JAVA SMTR REALTIME ALARM</h1>
  <div>
    <span id="lastUpdate"></span>
    <h5>AZH Automation</h5>
  </div>
</div>

<div class="action-bar">
<input type="text" id="searchInput" placeholder="Search...">
<button onclick="exportCSV()">Export</button>
</div>

<div class="summary-wrapper">

<div class="card">
<div>Total Alarm</div>
<div id="totalAlarm" style="font-size:24px">0</div>

<div>Total Site</div>
<div id="totalSite" style="font-size:24px">0</div>

<div>Total VIP Site</div>
<div id="totalVIP" style="font-size:24px">0</div>
</div>

<div class="card">
<div>Alarm Breakdown</div>
<div id="alarmBreakdown" style="font-size:12px;max-height:160px;overflow:auto"></div>
</div>

<div class="card">

<div>Alarm Aging (ALL)</div>
<div class="kpi-grid">
<div class="kpi" id="k1"><=1<br><b id="a1">0</b></div>
<div class="kpi yellow" id="k3"><=3<br><b id="a3">0</b></div>
<div class="kpi orange" id="k7"><=7<br><b id="a7">0</b></div>
<div class="kpi red" id="k14"><=14<br><b id="a14">0</b></div>
<div class="kpi darkred" id="k14p">>14<br><b id="a14p">0</b></div>
</div>

<div style="margin-top:10px">Alarm Aging (VIP)</div>
<div class="kpi-grid">
<div class="kpi" id="vk1"><=1<br><b id="v1">0</b></div>
<div class="kpi yellow" id="vk3"><=3<br><b id="v3">0</b></div>
<div class="kpi orange" id="vk7"><=7<br><b id="v7">0</b></div>
<div class="kpi red" id="vk14"><=14<br><b id="v14">0</b></div>
<div class="kpi darkred" id="vk14p">>14<br><b id="v14p">0</b></div>
</div>

</div>
</div>

</div>

<!-- TABLE -->
<div class="table-wrapper">
<table id="alarmTable">
<thead>
<tr>
<th>MAE</th>
<th>First Occurred</th>
<th>Site Name</th>
<th>Alarm Name</th>
<th>Escalate To</th>
<th>TT</th>
<th>WO</th>
<th>Updated At</th>
<th>MO Location</th>
</tr>
</thead>
<tbody></tbody>
</table>
</div>

</div>

<script>
let tableData=[];
let filteredData=[];

function csvUrl(){
 return "https://docs.google.com/spreadsheets/d/e/2PACX-1vSxUQUmAg4r0EtSRceK-GNihZ2dnWtn-DPFERHStdFM8RLafRn1uX9pmzFL9KyPCJIIax9lqo83FcE6/pub?gid=1143723754&single=true&output=csv&v="+Date.now();
}

function loadData(){
 Papa.parse(csvUrl(),{
  download:true,
  header:true,
  complete:(res)=>{
   tableData=res.data.filter(r=>r["Name"]);
   const now=new Date();

   tableData.forEach(r=>{
     const t=new Date(r["First Occurred (NT)"]);
     r.aging=(now-t)/86400000;
     r.vip=r["Alarm Source"]?.includes("VIP");
   });

   applyFilter();
   setLastUpdate();
  }
 });
}

function applyFilter(){
 const q=document.getElementById("searchInput").value.toLowerCase();
 filteredData=tableData.filter(r=>
   Object.values(r).join(" ").toLowerCase().includes(q)
 );
 renderTable(filteredData);
 renderSummary(filteredData);
}

function renderTable(data){
 const tbody=document.querySelector("#alarmTable tbody");
 tbody.innerHTML="";
 data.forEach(r=>{
   const tr=document.createElement("tr");

   if(r.vip) tr.classList.add("vip");

   if(r.aging>14) tr.classList.add("age14p");
   else if(r.aging>7) tr.classList.add("age14");
   else if(r.aging>3) tr.classList.add("age7");
   else if(r.aging>1) tr.classList.add("age3");

   tr.innerHTML=`
      <td>${r["Source"]||"-"}</td>
      <td>${r["First Occurred (NT)"]||"-"}</td>
      <td>${r["Alarm Source"]||"-"}</td>
      <td>${r["Name"]||"-"}</td>
      <td>${r["Escalate to"]||"-"}</td>
      <td>${r["TT"]||"-"}</td>
      <td>${r["WO"]||"-"}</td>
      <td>${r["Updated At"]||"-"}</td>
      <td>${r["MO Name"]||"-"}</td>
    `;
   tbody.appendChild(tr);
 });
}

function renderSummary(data){

 document.getElementById("totalAlarm").innerText=data.length;

 const siteSet=new Set();
 const vipSet=new Set();

 data.forEach(r=>{
   siteSet.add(r["Alarm Source"]);
   if(r.vip) vipSet.add(r["Alarm Source"]);
 });

 document.getElementById("totalSite").innerText=siteSet.size;
 document.getElementById("totalVIP").innerText=vipSet.size;

 const map={};
 data.forEach(r=>{
   map[r["Name"]]=(map[r["Name"]]||0)+1;
 });

 document.getElementById("alarmBreakdown").innerHTML=
 Object.entries(map).sort((a,b)=>b[1]-a[1])
 .map(([k,v])=>`${k}: <b>${v}</b>`).join("<br>");

 buildAging(data,false);
 buildAging(data,true);
}

function buildAging(data,isVIP){

 let b1=0,b3=0,b7=0,b14=0,b14p=0;
 const siteAging={};

 data.forEach(r=>{
   if(isVIP && !r.vip) return;

   const s=r["Alarm Source"];
   if(!siteAging[s]||r.aging>siteAging[s]) siteAging[s]=r.aging;
 });

 Object.values(siteAging).forEach(d=>{
   if(d<=1) b1++;
   else if(d<=3) b3++;
   else if(d<=7) b7++;
   else if(d<=14) b14++;
   else b14p++;
 });

 if(!isVIP){
   a1.innerText=b1; a3.innerText=b3; a7.innerText=b7;
   a14.innerText=b14; a14p.innerText=b14p;
 }else{
   v1.innerText=b1; v3.innerText=b3; v7.innerText=b7;
   v14.innerText=b14; v14p.innerText=b14p;
 }
}

function setLastUpdate(){
 document.getElementById("lastUpdate").innerText=new Date().toLocaleString();
}

function exportCSV(){
 const csv=Papa.unparse(filteredData);
 const blob=new Blob([csv]);
 const a=document.createElement("a");
 a.href=URL.createObjectURL(blob);
 a.download="alarm.csv";
 a.click();
}

document.getElementById("searchInput").addEventListener("input",applyFilter);

loadData();
setInterval(loadData,60000);
</script>

</body>
</html>
